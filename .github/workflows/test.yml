# Source: RESEARCH.md §Pattern 5 (lines 617–677). Two parallel jobs to keep PR feedback under 3 min.
# D-18: both test layers required as PR gates — these two job names become the required status checks
# on `main` branch protection. Status check names (mirror Phase 2 D-34 pattern):
#   - "Tests / vitest"      → branch protection required-status-check (D-18)
#   - "Tests / playwright"  → branch protection required-status-check (D-18)
# Adding these two names to main's branch protection is a manual GitHub UI step
# — see Plan 03-07 Task 1 (autonomous: false checkpoint).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # CR-01: lib/env.ts parses at module load and throws if any RESEND_*/UPSTASH_*
      # var is missing — `next build` and `next start` both crash without these.
      # Phase 3 doesn't exercise Resend/Upstash (stub action only), so these are
      # syntactically-valid but non-functional placeholders sufficient for build +
      # boot. Real values are wired in Phase 4 via Vercel/GitHub Actions secrets.
      - name: Build Next app
        run: npm run build
        env:
          RESEND_API_KEY: re_test_stub
          RESEND_AUDIENCE_ID: aud_test_stub
          RESEND_AUDIENCE_PREVIEW_ID: aud_test_preview_stub
          RESEND_WEBHOOK_SECRET: whsec_test_stub
          UPSTASH_REDIS_REST_URL: https://test.upstash.io
          UPSTASH_REDIS_REST_TOKEN: test_token_stub
          RESEND_FROM_POSTAL_ADDRESS: '123 Example St, Exampleville, EX 00000'
          VERCEL_ENV: development
      # CR-01: Playwright's `webServer` config (playwright.config.ts) boots
      # `next start` and propagates startup failures to the test runner —
      # replaces the prior `npx next start &` + `wait-on` pattern which masked
      # background-process exits as step success.
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          RESEND_API_KEY: re_test_stub
          RESEND_AUDIENCE_ID: aud_test_stub
          RESEND_AUDIENCE_PREVIEW_ID: aud_test_preview_stub
          RESEND_WEBHOOK_SECRET: whsec_test_stub
          UPSTASH_REDIS_REST_URL: https://test.upstash.io
          UPSTASH_REDIS_REST_TOKEN: test_token_stub
          RESEND_FROM_POSTAL_ADDRESS: '123 Example St, Exampleville, EX 00000'
          VERCEL_ENV: development
          # RESEND_MOCK=1 swaps lib/resend.ts to a hand-rolled mock for form e2e tests (260504-rw4) —
          # without it the form Server Action calls Resend with the stub key and fails 400.
          RESEND_MOCK: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
